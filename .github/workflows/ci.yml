on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Force ANSI color in tools that gate on TTY detection. `FORCE_COLOR`
      # covers the node ecosystem (chalk, picocolors, kleur, supports-color)
      # plus turbo and wrangler; `CLICOLOR_FORCE` covers Go tools like
      # treefmt that follow the BSD convention.
      FORCE_COLOR: '3'
      CLICOLOR_FORCE: '1'
      # `BUILD_MODE` picks each app's Vite build mode, which
      # `@lib/runtime-config` reads as the deploy environment. Pull
      # requests build `staging`; main and local builds fall through to
      # Vite's default `production`. Vite's mode is a CLI flag resolved
      # before vite.config loads, so it can't be branched on `GITHUB_REF`
      # in config — hence selecting it here. It's job-wide because it's
      # part of the build hash: the deploy steps must see the same value
      # as `pnpm check` to reuse its cached build instead of rebuilding.
      BUILD_MODE: ${{ github.event_name == 'pull_request' && 'staging' || '' }}
    # Run every shell step inside the flake's devShell so CI stays in
    # sync with local dev (single source of truth in flake.nix).
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      # No-op that absorbs the first `nix develop` evaluation so its
      # cost shows up here instead of inflating the next real step.
      - name: Warm devShell
        run: 'true'
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      # Needed for the per-package `test:browser` tasks. Local
      # dev uses the nix-provided chromium via `CHROMIUM_PATH`; CI uses
      # playwright's own binary.
      # Browser binaries are pinned to the playwright version, not the
      # whole lockfile — keying on the version keeps the cache warm
      # across unrelated dependency bumps (e.g. renovate churn).
      - name: Resolve playwright version
        id: playwright-version
        run: echo "version=$(pnpm -w list playwright --json | jq -r '.[0].devDependencies.playwright.version')" >> "$GITHUB_OUTPUT"
      - name: Restore playwright cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install playwright system deps
        run: pnpm exec playwright install-deps chromium
      - name: Install playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Local turbo cache lives at `.turbo/`. The cache key includes
      # `github.sha` so each run writes a fresh entry; restore-keys
      # falls back to the most recent prior entry on the same branch
      # (or the default branch) for a warm start.
      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      # `pnpm check` runs `cargo clippy` and `cargo test` over the Rust
      # workspace, but turbo's cache doesn't capture Rust artifacts (those
      # tasks emit no outputs). Cache the cargo registry/git checkouts and
      # the build `target/` so compilation is incremental across runs.
      # Keyed on `Cargo.lock`; restore-keys falls back to the latest prior
      # entry so an unchanged dep graph still warms `target/` from source
      # edits.
      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # `pnpm check` fans out every workspace check (lint, typecheck,
      # tests, knip, fmt, workspace validators, build) through turbo.
      # Cache hits skip work entirely. The build is part of `check`, so
      # the deploy tasks below reuse its `.output` from turbo's cache.
      - run: pnpm check

      # Each app with a `deploy` script ships to its own worker. Deploys
      # are cached turbo tasks keyed on the build, so apps whose build
      # didn't change since the last deploy are skipped.
      #
      # Single-step `wrangler deploy` works but bypasses the version
      # model. Splitting into `wrangler versions upload` +
      # `wrangler versions deploy` would unlock `wrangler rollback` and
      # gradual rollouts — worth doing if an app ever needs a safety
      # net beyond "redeploy the previous commit".
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm turbo run deploy

      # Uploads a preview version of each app on same-repo pull requests
      # without promoting to production. The `--preview-alias` pins each
      # URL to the PR number so reviewers get stable links across pushes.
      # Each app writes wrangler's ND-JSON report under
      # `.wrangler/deploy/`, which turbo restores on a cache hit.
      - name: Upload preview versions
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm turbo run deploy:preview

      # Records one GitHub Deployment per app so the PR sidebar shows a
      # `preview-<worker>` tile linking to its workers.dev URL.
      - name: Record preview deployments
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shopt -s nullglob
          for report in packages/*/*/.wrangler/deploy/preview.ndjson; do
            jq -r 'select(.type == "version-upload" and .preview_alias_url != null)
              | [.worker_name, .preview_alias_url] | @tsv' "$report" |
            while IFS=$'\t' read -r worker url; do
              # `required_contexts[]` (no value) sends an empty JSON
              # array — without it GitHub enforces commit status checks
              # against the PR's still-running CI run and 409s.
              deployment_id=$(gh api "repos/$REPO/deployments" \
                -f ref="$SHA" \
                -f environment="preview-$worker" \
                -F auto_merge=false \
                -f required_contexts[] \
                -F transient_environment=true \
                -F production_environment=false \
                --jq .id)
              gh api "repos/$REPO/deployments/$deployment_id/statuses" \
                -f state=success \
                -f environment_url="$url" \
                -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            done
          done
